<h1>{{ object|yesno:"Update,Create" }} {{ type }}</h1>
<form action="" method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <br>
  <input type="submit" value="Submit">
</form>
<br>
{% if pk %}
  <a href="{% url url_name pk=pk %}">Cancel</a>
{% else %}
  <a href="{% url url_name %}">Cancel</a>
{% endif %}
