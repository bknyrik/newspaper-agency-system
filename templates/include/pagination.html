{% load query_transform %}
{% if is_paginated %}
  <ul>
    {% if page_obj.has_previous %}
      <li><a href="?{% query_transform request page=page_obj.previous_page_number %}">Previous</a></li>
    {% endif %}
    {% for page_number in paginator.page_range %}
      <li><a href="?{% query_transform request page=page_number %}">{{ page_number }}</a></li>
    {% endfor %}
    {% if page_obj.has_next %}
      <li><a href="?{% query_transform request page=page_obj.next_page_number %}">Next</a></li>
    {% endif %}
  </ul>
{% endif %}
