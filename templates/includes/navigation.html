{% load static %}
<header>
  <nav class="navbar navbar-main bg-tertiary text-white">
    <div class="container position-relative">
      <a class="navbar-brand mr-lg-3" href="#">
        <img class="navbar-brand-dark" src="{% static "img/brand-light.svg" %}" alt="menuimage">
      </a>
      <ul class="nav flex-fill">
        <li class="nav-item"><a class="nav-link" href="{% url "editor:index" %}">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url "editor:topic-list" %}">Topics</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url "editor:newspaper-list" %}">Newspapers</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url "editor:redactor-list" %}">Redactors</a></li>
      </ul>
      <div class="d-flex align-items-center">
        {% if user.is_authenticated %}
          <a class="d-none text-white d-lg-inline me-md-3"
             href="{% url "editor:redactor-detail" pk=user.id %}">{{ user.username }}</a>
          <form action="{% url "logout" %}" method="post">
            {% csrf_token %}
            <button class="btn btn-outline-gray-100 d-none d-lg-inline me-md-3">Log out</button>
          </form>
        {% else %}
          <a class="btn btn-outline-gray-100 d-none d-lg-inline me-md-3" href="{% url "login" %}">Log in</a>
        {% endif %}
      </div>
    </div>
  </nav>
</header>
