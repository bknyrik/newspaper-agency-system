{% load query_transform %}
{% if is_paginated %}
  <nav>
    <ul class="pagination">
      {% if page_obj.has_previous %}
        <li class="page-item"><a class="page-link"
                                 href="?{% query_transform request page=page_obj.previous_page_number %}">Previous</a>
        </li>
      {% endif %}
      {% for page_number in paginator.page_range %}
        <li class="page-item"><a class="page-link"
                                 href="?{% query_transform request page=page_number %}">{{ page_number }}</a></li>
      {% endfor %}
      {% if page_obj.has_next %}
        <li class="page-item"><a class="page-link" href="?{% query_transform request page=page_obj.next_page_number %}">Next</a>
        </li>
      {% endif %}
    </ul>
  </nav>
{% endif %}
