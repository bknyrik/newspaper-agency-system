<section class="section bg-secondary text-white pb-12">
  <div class="container">
    <div class="row">
      <div class="col-12 mb-5 mt-7">
        <h1>Delete {{ type }} {{ name }}</h1>
        <p class="lead">Are you sure you want to delete this {{ type }}?</p>
        <form action="" method="post">
          {% csrf_token %}
          {{ form }}
          <input class="btn btn-outline-danger mb-3" type="submit" value="Delete">
        </form>
        {% if pk %}
          <a class="btn btn-outline-gray-100" href="{% url url_name pk=pk %}">Cancel</a>
        {% else %}
          <a class="btn btn-outline-gray-100" href="{% url url_name %}">Cancel</a>
        {% endif %}
      </div>
    </div>
  </div>
</section>
