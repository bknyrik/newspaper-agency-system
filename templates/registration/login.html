{% extends "base.html" %}
{% block title %}
  <title>Login | Newspaper Agency</title>
{% endblock %}
{% block content %}
  <section class="section-header bg-secondary text-white">
    <div class="container">
      <div class="row">
        <div class="col-12">
          <h1>Login</h1>
          {% if form.errors %}
            <p class="lead fw-bold bg-danger">Please enter a correct username and password. Note that both fields may be
              case-sensitive.</p>
          {% endif %}
          <form action="{% url "login" %}" method="post">
            {% csrf_token %}
            <div class="form-group">
              <label for="id_username">Username:</label>
              <input class="form-control" type="text" name="username" autofocus="" autocapitalize="none"
                     autocomplete="username"
                     maxlength="150" required="" id="id_username">
            </div>
            <div class="form-group mt-3">
              <label for="id_password">Password:</label>
              <input class="form-control" type="password" name="password" autocomplete="current-password" required="" id="id_password">
            </div>
            <input class="btn btn-outline-info mt-3" type="submit" value="Log in">
          </form>
        </div>
      </div>
    </div>
  </section>
{% endblock %}
