{% extends "base.html" %}
{% block content %}
  <h1>Newspaper {{ newspaper.title }}</h1>
  <section>
    <h3>Information</h3>
    <p>Published date: {{ newspaper.published_date }}</p>
    <p>Topics: {{ newspaper.topics_str }}</p>
  </section>
  <hr>
  <section>
    <h3>Content</h3>
    <p>{{ newspaper.content }}</p>
  </section>
{% endblock %}
