{% extends "base.html" %}
{% block title %}
  <title>{{ object|yesno:"Update,Create" }} redactor | Newspaper Agency</title>
{% endblock %}
{% block content %}
  <section class="section bg-secondary text-white pt-8">
    <div class="container">
      <div class="row">
        <div class="col-12">
          {% if object %}
            <a class="btn btn-outline-gray-100 mt-5" href="{% url "editor:redactor-detail" pk=object.id %}">Cancel</a>
          {% else %}
            <a class="btn btn-outline-gray-100 mt-5" href="{% url "editor:redactor-list" %}">Cancel</a>
          {% endif %}
        </div>
      </div>
    </div>
  </section>
{% endblock %}
