{% extends "base.html" %}
{% block content %}
  <section class="section bg-secondary text-white">
    <div class="container">
      <div class="row">
        <div class="col-12">
          <h1>{{ object|yesno:"Update,Create" }} redactor</h1>
          <form action="" method="post">
            {% csrf_token %}
            <div class="form-group">
              <label for="id_username">Username:</label>
              <input class="form-control" type="text" name="username" maxlength="150" autocapitalize="none"
                     autocomplete="username" {% if object %}value="{{ redactor.username }}"{% endif %}
                     autofocus="" required="" aria-describedby="id_username_helptext" id="id_username">
              <span class="form-text text-white" id="id_username_helptext">Required. 150 characters or fewer. Letters, digits and @/./+/-/_ only.</span>
            </div>
            <div class="form-group mt-3">
              <label for="id_first_name">First name:</label>
              <input class="form-control" type="text" name="first_name" maxlength="150" id="id_first_name"
                     {% if object %}value="{{ redactor.first_name }}"{% endif %}>
            </div>
            <div class="form-group mt-3">
              <label for="id_last_name">Last name:</label>
              <input class="form-control" type="text" name="last_name" maxlength="150" id="id_last_name"
                     {% if object %}value="{{ redactor.last_name }}"{% endif %}>
            </div>
            <div class="form-group mt-3">
              <label for="id_email">Email address:</label>
              <input class="form-control" type="email" name="email" maxlength="254" id="id_email"
                     {% if object %}value="{{ redactor.email }}"{% endif %}>
            </div>
            <div class="form-group mt-3">
              <label for="id_years_of_experience">Years of experience:</label>
              <input class="form-control" type="number" name="years_of_experience" min="1" id="id_years_of_experience"
                     {% if object %}value="{{ redactor.years_of_experience }}"{% endif %}>
            </div>
            <input class="btn btn-outline-info mt-3" type="submit" value="{{ object|yesno:"Update,Create" }}">
            <input class="btn btn-outline-info mt-3" type="reset" value="Reset">
          </form>
        </div>
      </div>
    </div>
  </section>
{% endblock %}
