{% extends "base.html" %}
{% block content %}
  <h1>Topic list</h1>
  <a href="{% url "editor:topic-create" %}">Create</a>
  {% if topic_list %}
    <table>
      <tr>
        <th>Id</th>
        <th>Name</th>
        <th>Update</th>
        <th>Delete</th>
      </tr>
      {% for topic in topic_list %}
        <tr>
          <td>{{ topic.id }}</td>
          <td>{{ topic }}</td>
          <td><a href="{% url "editor:topic-update" pk=topic.id %}">Update</a></td>
          <td><a href="{% url "editor:topic-delete" pk=topic.id %}">Delete</a></td>
        </tr>
      {% endfor %}
    </table>
  {% else %}
    <p>There are no topics in the system.</p>
  {% endif %}
{% endblock %}
